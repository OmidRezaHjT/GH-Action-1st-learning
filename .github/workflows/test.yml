name: test
on: 
  push:
    paths:
      - 'second-action/**'
      - '.github/workflows/test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-action
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install nodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: npm install
        run: npm ci
      - name: run tests
        run: npm test

      
