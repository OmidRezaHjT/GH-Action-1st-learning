name: deployment
on: 
  push:
    paths:
      - 'second-action/**'
      - '.github/workflows/deployment.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second-action
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: install nodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: npm install
        run: npm ci
      - name: run tests
        run: npm test
  deploy:
      needs: test
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: second-action
      steps:
        - name: get code
          uses: actions/checkout@v3
        - name: install nodeJS
          uses: actions/setup-node@v3
          with:
            node-version: 18
        - name: npm install
          run: npm ci
        - name: build project
          run: npm run build
        - name: Deploy
          run: echo "Deploying . . . ."
